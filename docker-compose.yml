name: locale-admin

# Values come from .env (cp .env.example .env). Shell variables override them, e.g.
# LOGIN_RATE_LIMIT_MAX=1000 docker compose up (used by pnpm test:e2e).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      POSTGRES_DB: ${POSTGRES_DB:-locale}
    ports:
      # Bound to localhost only: the DB uses a dev password.
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Inside Docker the DB host is "db", not the localhost URL from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-locale}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-locale}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env (cp .env.example .env)}
      # The local stack runs on http://localhost:8080, so Secure cookies would be dropped (Safari, WebKit).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-2}
      EXPORT_QUEUE_MAX: ${EXPORT_QUEUE_MAX:-20}
      EXPORT_QUEUE_TIMEOUT_MS: ${EXPORT_QUEUE_TIMEOUT_MS:-10000}
      EXPORT_TIMEOUT_MS: ${EXPORT_TIMEOUT_MS:-60000}
    # init: true runs a tiny init as PID 1 that forwards signals and reaps zombies.
    init: true
    ports:
      # Debug access only, bound to localhost (a direct client could spoof X-Forwarded-For otherwise).
      - '127.0.0.1:3001:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
