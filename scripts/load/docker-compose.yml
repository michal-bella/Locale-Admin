# Load test stack for the export (scripts/load/run-export.sh), separate from the dev stack: own project name,
# own throwaway database, two backend replicas with the production limit of 2 GB each, nginx on 127.0.0.1:8090.
name: locale-load

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: locale
      POSTGRES_PASSWORD: ${LOAD_DB_PASSWORD:-locale-load}
      POSTGRES_DB: locale
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U locale -d locale']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://locale:${LOAD_DB_PASSWORD:-locale-load}@db:5432/locale
      SEED_ADMIN_PASSWORD: ${LOAD_ADMIN_PASSWORD:-load-test-admin}
      COOKIE_SECURE: 'false'
      LOGIN_RATE_LIMIT_MAX: 1000
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-2}
      EXPORT_QUEUE_MAX: ${EXPORT_QUEUE_MAX:-20}
      EXPORT_QUEUE_TIMEOUT_MS: ${EXPORT_QUEUE_TIMEOUT_MS:-10000}
      EXPORT_TIMEOUT_MS: ${EXPORT_TIMEOUT_MS:-60000}
    init: true
    # Both replicas seed on start; the one that loses the race on the admin user exits and seeds again (idempotent).
    restart: on-failure
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # The production nginx config; it resolves `backend` to both replicas at start and balances round robin.
  nginx:
    image: nginx:1.30.6-alpine3.24
    volumes:
      - ../../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8090:80'
    depends_on:
      backend:
        condition: service_healthy
